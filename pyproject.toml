[project]
name = "phdata-mle-project-challenge-2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Douglas Sgrott", email = "doug.sgrott@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pydantic>=2.14.2",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]



[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # pycodestyle, pyflakes, isort, pyupgrade, bugbear

[dependency-groups]
dev = [
    "httpx>=0.24.0",
    "hypothesis>=6.82.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.17.3",
]

